    <!-- Phone-number reveal: CallRail (loaded via GTM) swaps the displayed
         number per visitor for call attribution. Number text (.cr-number)
         stays invisible (space reserved) until the swap has happened or
         2.5s passes, so visitors never see the number change on screen. -->
    <script>
(function(){
  var done = false;
  function reveal(){
    if (done) return; done = true;
    document.documentElement.classList.add('cr-ready');
    if (window.__crInterval) clearInterval(window.__crInterval);
  }
  function swapped(){
    var els = document.querySelectorAll('.cr-number');
    for (var i = 0; i < els.length; i++) {
      var t = els[i].textContent || '';
      if (/\d{3}[\s.\-]?\d{4}/.test(t) && t.indexOf('764-4344') === -1) return true;
    }
    return false;
  }
  document.addEventListener('DOMContentLoaded', function(){
    if (swapped()) return reveal();
    window.__crInterval = setInterval(function(){ if (swapped()) reveal(); }, 150);
    setTimeout(reveal, 2500);
  });
})();
    </script>
    <noscript><style>.cr-number { visibility: visible !important; }</style></noscript>
